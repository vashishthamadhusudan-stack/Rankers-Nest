name: Quiz browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run local and live-site browser tests
        env:
          LIVE_BASE: https://vashishthamadhusudan-stack.github.io/Rankers-Nest
        run: node scripts/quiz-browser-qa.cjs
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-browser-qa-results
          path: quiz-browser-qa-results.json
          if-no-files-found: ignore# Re-run after fixing score assertion for the Gauss page.
